<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kayara</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f0f10;
      --surface: #17181a;
      --surface-2: #1f2124;
      --surface-3: #26282c;
      --border: #2c2e33;
      --border-soft: #232529;
      --text: #e8e8e8;
      --text-dim: #9a9aa0;
      --text-faint: #6b6b72;
      --accent: #ffffff;
      --err: #f28b82;
      --ok: #81c995;
      --radius: 20px;
    }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    #app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── Header ─────────────────────────── */
    #topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--border-soft);
    }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; letter-spacing: 0.2px; }
    .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .topbar-right { display: flex; align-items: center; gap: 8px; }

    #model-picker { position: relative; }
    #model-btn {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 7px 12px; border-radius: 999px;
      cursor: pointer; font-size: 12.5px; transition: background 0.15s;
    }
    #model-btn:hover { background: var(--surface-2); }
    #model-btn .chev { font-size: 10px; color: var(--text-dim); }
    #model-menu {
      position: absolute; top: calc(100% + 6px); right: 0;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 14px; min-width: 200px; z-index: 100; display: none;
      overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.45);
      padding: 4px;
    }
    .model-item {
      padding: 9px 12px; cursor: pointer; font-size: 13px;
      border-radius: 9px; display: flex; justify-content: space-between; align-items: center;
    }
    .model-item:hover { background: var(--surface-3); }
    .model-item.active { color: var(--accent); }
    .model-item.active::after { content: "✓"; font-size: 12px; }

    #clear-btn {
      background: transparent; border: 1px solid transparent; color: var(--text-dim);
      padding: 7px 12px; border-radius: 999px; cursor: pointer; font-size: 12.5px;
      transition: color 0.15s, background 0.15s;
    }
    #clear-btn:hover { color: var(--text); background: var(--surface); }

    /* ── Chat area ──────────────────────── */
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #chat-scroll { flex: 1; overflow-y: auto; padding: 24px 20px 8px; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--border); border-radius: 999px;
      border: 3px solid var(--bg); background-clip: padding-box;
      min-height: 40px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-faint);
      border: 3px solid var(--bg); background-clip: padding-box;
    }
    ::-webkit-scrollbar-corner { background: transparent; }
    #chat { max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

    .msg { display: flex; flex-direction: column; gap: 6px; }
    .msg.user { align-items: flex-end; }
    .msg.ai { align-items: flex-start; }

    .name {
      font-size: 12px; color: var(--text-dim); padding: 0 4px;
      display: flex; align-items: center; gap: 6px; font-weight: 600;
    }
    .name .avatar {
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--surface-3); border: 1px solid var(--border);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 10px;
    }

    .bubble {
      max-width: 85%; padding: 12px 16px;
      word-wrap: break-word; white-space: pre-wrap;
      font-size: 14.5px; line-height: 1.65;
    }
    .msg.user .bubble {
      background: var(--surface-2); color: var(--text);
      border-radius: var(--radius) var(--radius) 6px var(--radius);
    }
    .msg.ai .bubble { background: transparent; color: var(--text); padding: 2px 4px; }
    .bubble strong { color: var(--accent); font-weight: 600; }
    .bubble code.inline {
      background: var(--surface-3); border-radius: 4px; padding: 1px 5px;
      font-family: Consolas, monospace; font-size: 13px;
    }
    .bubble .quote {
      display: block; border-left: 2px solid var(--border); padding-left: 10px;
      color: var(--text-dim); margin: 4px 0;
    }

    .actions { display: flex; gap: 14px; font-size: 12px; padding: 0 4px; opacity: 0.7; }
    .actions a { color: var(--text-dim); text-decoration: none; cursor: pointer; transition: color 0.15s; }
    .actions a:hover { color: var(--text); }
    .actions a.apply {
      color: var(--ok); border: 1px solid var(--border);
      border-radius: 999px; padding: 2px 10px;
    }
    .actions a.apply:hover { background: var(--surface-2); }

    /* ── Typing ─────────────────────────── */
    #typing { padding: 4px; display: flex; gap: 6px; }
    .typing-dot { width: 7px; height: 7px; background: var(--text-dim); border-radius: 50%; animation: blink 1.4s infinite both; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); } 40% { opacity: 1; transform: scale(1); } }

    /* ── Composer ───────────────────────── */
    #composer { padding: 12px 20px 16px; background: var(--bg); }
    #quickbar {
      max-width: 700px; margin: 0 auto 8px;
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    #quickbar .qchip {
      padding: 4px 12px; font-size: 11.5px;
      background: transparent; border-color: var(--border);
    }
    #quickbar .qchip:hover { background: var(--surface); }
    #composer-inner {
      max-width: 700px; margin: 0 auto;
      display: flex; gap: 10px; align-items: flex-end;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 26px; padding: 8px 10px 8px 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      transition: border-color 0.15s;
    }
    #composer-inner:focus-within { border-color: var(--text-faint); }
    #input {
      flex: 1; background: transparent; border: none; color: var(--text);
      font-family: inherit; font-size: 14.5px; line-height: 1.5;
      resize: none; outline: none; min-height: 26px; max-height: 140px; padding: 6px 0;
    }
    #input::placeholder { color: var(--text-faint); }
    #send {
      width: 38px; height: 38px; background: var(--accent); border: none;
      border-radius: 50%; color: #0f0f10; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      transition: opacity 0.15s, transform 0.1s;
    }
    #send:hover { opacity: 0.88; }
    #send:active { transform: scale(0.94); }
    #send:disabled { opacity: 0.35; cursor: not-allowed; }
    .composer-hint {
      max-width: 700px; margin: 8px auto 0; text-align: center;
      font-size: 11px; color: var(--text-faint);
    }

    /* ── Status ─────────────────────────── */
    #statusbar { padding: 6px 20px 10px; background: var(--bg); text-align: center; min-height: 26px; }
    #status { font-size: 12px; color: var(--text-dim); }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--err); }

    /* ── Batch progress ─────────────────── */
    #batchbar { max-width: 700px; margin: 0 auto 8px; text-align: left; }
    #batchbar .bb-label {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 11.5px; color: var(--text-dim); margin-bottom: 5px; padding: 0 2px;
    }
    #batchbar .bb-label .bb-title { color: var(--text); font-weight: 600; }
    #batchbar .bb-track {
      height: 7px; background: var(--surface-2);
      border: 1px solid var(--border-soft); border-radius: 999px; overflow: hidden;
    }
    #bb-fill {
      height: 100%; width: 0%; border-radius: 999px;
      background: repeating-linear-gradient(45deg, var(--accent) 0 10px, #b8b8b8 10px 20px);
      background-size: 28px 28px;
      transition: width 0.35s ease;
      animation: bb-slide 0.7s linear infinite;
    }
    @keyframes bb-slide { to { background-position: 28px 0; } }

    /* ── Welcome ────────────────────────── */
    #welcome {
      text-align: center; color: var(--text-dim);
      padding: 64px 20px; line-height: 1.6;
    }
    #welcome .logo {
      width: 52px; height: 52px; margin: 0 auto 18px;
      border-radius: 16px; background: var(--surface-2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; font-size: 26px;
    }
    #welcome h1 { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
    #welcome p { font-size: 13.5px; }
    .chips { display: flex; gap: 8px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
    .chip {
      background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
      padding: 8px 14px; border-radius: 999px; font-size: 12.5px; cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .chip:hover { background: var(--surface-2); color: var(--text); }
  </style>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <div class="brand"><span class="dot"></span>Kayara</div>
      <div class="topbar-right">
        <div id="model-picker">
          <button id="model-btn"><span id="model-label">Model</span><span class="chev">▾</span></button>
          <div id="model-menu"></div>
        </div>
        <button id="clear-btn">Clear</button>
      </div>
    </div>
    <div id="main">
      <div id="chat-scroll">
        <div id="chat">
          <div id="welcome">
            <div class="logo">🌸</div>
            <h1>Konnichiwa!</h1>
            <p>Tanya apa saja soal bahasa Jepang — terjemahan, grammar, atau kosakata.</p>
            <div class="chips">
              <button class="chip" data-q="「頑張る」artinya apa?">「頑張る」artinya apa?</button>
              <button class="chip" data-q="Jelaskan perbedaan は dan が">Beda は dan が</button>
              <button class="chip" data-q="Contoh kalimat sehari-hari bahasa Jepang">Contoh kalimat sehari-hari</button>
            </div>
          </div>
        </div>
        <div id="typing" style="display:none"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>
      </div>
    </div>
    <div id="composer">
      <div id="quickbar">
        <button class="chip qchip" data-q="/tr">🇮🇩 Terjemah + simpan</button>
        <button class="chip qchip" id="btn-undo">↶ Undo</button>
        <button class="chip qchip" id="btn-redo">↷ Redo</button>
      </div>
      <div id="composer-inner">
        <textarea id="input" placeholder="Tanya Kayara..." rows="1"></textarea>
        <button id="send" aria-label="Send">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <div class="composer-hint">Enter untuk kirim · Shift+Enter baris baru · /tr = terjemah + simpan</div>
    </div>
    <div id="statusbar">
      <div id="batchbar" style="display:none">
        <div class="bb-label"><span class="bb-title" id="bb-text"></span><span id="bb-count"></span></div>
        <div class="bb-track"><div id="bb-fill"></div></div>
      </div>
      <span id="status"></span>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
